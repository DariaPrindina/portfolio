name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Одновременно идёт только одна выкатка, но начатую не обрываем:
# иначе Pages может остаться с наполовину опубликованной версией.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Сайт статический: проверки и сборка в одном job, и
  # публикация физически не стартует, пока он не позеленеет.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm run test

      # Статический экспорт кладёт готовый сайт в out/. Свой домен задаётся
      # в настройках Pages: при деплое через Actions файл CNAME не читается.
      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Из коммита нужен только заголовок: тело бывает многострочным
      # и превращает уведомление в простыню.
      - name: Collect commit info
        id: info
        run: |
          {
            echo "title=$(git log -1 --pretty=%s)"
            echo "sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Telegram Notification
        if: always()
        # Сломанное уведомление не должно выдавать успешный деплой за провал.
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ github.event.repository.name }} ${{ job.status == 'success' && '· 🛰 вышли на орбиту' || '· 💥 не долетели' }}

            ${{ steps.info.outputs.title }}

            🔭 ${{ steps.info.outputs.sha }} · ${{ github.actor }}
            ${{ job.status == 'success' && '🌍 https://dariaprindina.ru' || '🧯 Сайт остался на прежней версии' }}

            Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
