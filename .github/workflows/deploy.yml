name: Deploy to VDS

on:
  workflow_run:
    workflows: ["Quality Check"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        id: deploy
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/portfolio
            git pull origin main
            docker compose down
            docker compose build --no-cache
            docker compose up -d --force-recreate
            echo "Deploy completed at $(date)"

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Деплой на dariaprindina.ru завершён!

            Статус: ${{ job.status == 'success' && '✅ УСПЕШНО' || '❌ ОШИБКА' }}
            Время: ${{ github.event.workflow_run.updated_at }}
            Коммит: ${{ github.event.workflow_run.head_commit.message }}
            Автор: ${{ github.event.workflow_run.actor.login }}
            Ссылка: ${{ github.event.workflow_run.html_url }}

            Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
