name: Deploy to VDS

on:
  push:
    branches: [main]

jobs:
  # Проверки продублированы здесь намеренно: пока деплой зависел от отдельного
  # workflow, прямой push в main выкатывался без единой проверки.
  # Теперь job deploy физически не может стартовать, пока этот не позеленеет.
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Verify production build
        run: npm run build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        id: deploy
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/portfolio
            git pull origin main

            # Образ собирается, пока старый контейнер продолжает отвечать.
            # Раньше здесь стоял docker compose down перед сборкой, и сайт
            # лежал всё время пересборки, а не пару секунд.
            docker compose build

            # Единственный момент недоступности — подмена контейнера.
            # --wait держит шаг до тех пор, пока healthcheck не позеленеет,
            # поэтому неудачная выкатка не пройдёт молча.
            docker compose up -d --force-recreate --wait

            # Старые слои иначе копятся и забивают диск VDS.
            docker image prune -f
            echo "Deploy completed at $(date)"

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Деплой на dariaprindina.ru завершён!

            Статус: ${{ job.status == 'success' && '✅ УСПЕШНО' || '❌ ОШИБКА' }}
            Время: ${{ github.event.head_commit.timestamp }}
            Коммит: ${{ github.event.head_commit.message }}
            Автор: ${{ github.actor }}
            Ссылка: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
