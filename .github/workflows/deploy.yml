name: Deploy to VDS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        id: deploy
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/portfolio
            git pull origin main
            docker compose down
            docker compose build --no-cache
            docker compose up -d --force-recreate
            echo "Deploy completed at $(date)"

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Деплой на dariaprindina.ru завершён!

            Статус: ${{ job.status == 'success' && '✅ УСПЕШНО' || '❌ ОШИБКА' }}
            Время: ${{ github.event.head_commit.timestamp }}
            Коммит: ${{ github.event.head_commit.message }}
            Автор: ${{ github.actor }}
            Ссылка: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
