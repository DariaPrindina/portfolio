name: Deploy to VDS

on:
  push:
    branches: [main]

jobs:
  # Проверки продублированы здесь намеренно: пока деплой зависел от отдельного
  # workflow, прямой push в main выкатывался без единой проверки.
  # Теперь job deploy физически не может стартовать, пока этот не позеленеет.
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Verify production build
        run: npm run build

  # Образ собирается здесь, а не на VDS. На сервере 2 ГБ памяти и восемь
  # контейнеров: сборка Next.js уходила в своп и вставала намертво.
  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ghcr.io/dariaprindina/portfolio:latest
            ghcr.io/dariaprindina/portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-main
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        id: deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /var/www/portfolio

            # Нужен только для docker-compose.yml, исходники на сервере
            # больше не собираются.
            git pull origin main

            # Токен одноразовый, живёт лишь на время этого запуска.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose pull

            # Единственный момент недоступности — подмена контейнера.
            # --wait держит шаг, пока healthcheck не позеленеет, поэтому
            # неудачная выкатка не пройдёт молча.
            docker compose up -d --force-recreate --wait

            docker logout ghcr.io
            # Старые слои иначе копятся и забивают диск.
            docker image prune -f
            echo "Deploy completed at $(date)"

      - name: Send Telegram Notification
        if: always()
        # Уведомление не должно решать судьбу деплоя. С недействительным
        # токеном успешная выкатка отмечалась упавшей — по красному крестику
        # нельзя было понять, сломан сайт или всего лишь бот.
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Деплой на dariaprindina.ru завершён!

            Статус: ${{ job.status == 'success' && '✅ УСПЕШНО' || '❌ ОШИБКА' }}
            Время: ${{ github.event.head_commit.timestamp }}
            Коммит: ${{ github.event.head_commit.message }}
            Автор: ${{ github.actor }}
            Ссылка: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
