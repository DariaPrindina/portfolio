services:
  app:
    # Готовый образ собирается в GitHub Actions и скачивается сюда.
    # На сервере 2 ГБ памяти и восемь контейнеров — сборка Next.js
    # уходила в своп и вставала.
    image: ghcr.io/dariaprindina/portfolio:latest
    restart: always
    mem_limit: 256m
    memswap_limit: 512m
    environment:
      - NODE_ENV=production
    # Деплой ждёт, пока новый контейнер начнёт отвечать, и падает, если
    # не дождался. Без этого выкатка считалась бы успешной, даже когда
    # приложение не поднялось.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default

networks:
  default:
